version: '0.1'

services:
  api:
    build: ./SpringBoot
    ports:
      - "8080:8080"
    networks:
      - redWeb
    depends_on:
      - db


  db:
    build: ./Postgres
    ports:
      - "5432:5432"
    networks:
      - redWeb


  frontend:
    build: ./Next
    ports:
      - "3000:3000"
    networks:
      - redWeb
    depends_on:
      - api


networks:
  redWeb:
    driver: bridge
